name: Deploy VPS

on:
  push:
    branches: [main]

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: fetch & build on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FRONTEND_DIR: /var/www/arrhythmia-detection-dashboard
        run: |
          set -e
          ssh "$VPS_USER@$VPS_HOST" "set -e
            cd '$FRONTEND_DIR'
            git fetch origin main
            git checkout main
            git pull origin main
            npm ci
            # VITE_APP_VERSION dari secrets repo ini, di-inject ke proses build di VPS
            VITE_APP_VERSION='${{ secrets.VITE_APP_VERSION }}' npm run build
          "
          # File statis baru ada di $FRONTEND_DIR/dist/ — sesuaikan nginx root
          # dengan path yang kamu serve (mis. 'root /var/www/arrhythmia-detection-dashboard/dist;')
